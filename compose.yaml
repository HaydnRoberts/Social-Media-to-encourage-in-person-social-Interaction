name: Social-Media-to-encourage-in-person-social-Interaction
services:
  frontend:
    image: nginx
    volumes:
      - ./app-frontend:/usr/share/nginx/html:ro
    ports:
     - "81:80"

  backend:
    image: node:22.22.2
    volumes:
      - ./app-backend:/usr/src/app
    ports:
      - "82:9000"
    working_dir: /usr/src/app
    command: sh -c "
      npm install &&
      chmod +x run.sh &&
      ./run.sh"
    links:
      - database

  database:
    image: mongo:8.2.2
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - 83:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      